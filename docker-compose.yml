version: '3.8'

services:
  nemesis-studio:
    build: .
    container_name: nemesis-agent-studio
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NEBIUS_BASE_URL=https://api.studio.nebius.ai/v1
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    restart: unless-stopped
